volumes:
  reth:
  node:

services:
  reth:
    image: ${RETH_IMAGE}
    restart: unless-stopped
    ports:
      # reth http rpc
      - "8545:8545"
      # reth ws rpc
      - "8546:8546"
      # reth engine authrpc
      - "8551:8551"
      # reth metrics
      - "9001:9001"
      # reth p2p
      - "30303:30303"
      - "30303:30303/udp"
    env_file:
      - .env
    volumes:
      - "reth:/data"
      - "./jwt:/jwt"
      - "./config:/config:ro"
      - "./entrypoints/op-reth.sh:/entrypoints/op-reth.sh"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        exec /entrypoints/op-reth.sh

  node:
    depends_on:
      - reth
    image: ${NODE_IMAGE}
    restart: unless-stopped
    ports:
      # node rpc
      - "9545:9545"
      # node p2p
      - "9003:9003"
      # node metrics
      - "7300:7300"
    env_file:
      - .env
    volumes:
      - "node:/data"
      - "./jwt:/jwt"
      - "./config:/config:ro"
      - "./entrypoints/op-node.sh:/entrypoints/op-node.sh"
    entrypoint: ["/bin/sh", "-c"]
    links:
      - "reth:reth"
    command:
      - |
        exec /entrypoints/op-node.sh
